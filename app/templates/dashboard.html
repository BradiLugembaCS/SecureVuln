
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureVuln - Dashboard</title>
</head>
<body>
    <h1>SecureVuln Dashboard</h1>

    <p>Welcome, {{ current_user.username }}!</p>
    <p>Your role: {{ current_user.role }}</p>

    <!-- Logging out uses POST so the request can be CSRF-protected. -->
    <form action="{{ url_for('main.logout') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout</button>
    </form>
</body>
</html>
